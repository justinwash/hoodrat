[package]
name = "hoodrat"
version = "0.1.0"
edition = "2021"
description = "Windows-first agentic trading supervisor for Robinhood Agentic Trading"
license = "MIT"
build = "build.rs"

[[bin]]
name = "hoodrat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.13"

[build-dependencies]
slint-build = "1.13"